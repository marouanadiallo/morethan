        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    PersonLight:
      type: object
      properties:
        cecimaId:
          type: integer
          format: int64
        revisionId:
          type: integer
          format: int64
        lastName:
          type: string
        firstName:
          type: string
        birthDay:
          type: string
        birthMonth:
          type: string
        birthYear:
          type: string
    Person:
