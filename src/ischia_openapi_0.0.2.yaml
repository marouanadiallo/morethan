openapi: 3.2.0
info:
  title: Swagger ISCHIA Service - OpenAPI 3.2
  description: |-
    Swagger ISCHIA Service
    - [OpenAPI 3.2 Specification](https://spec.openapis.org/oas/v3.2.0.html)

  termsOfService: https://swagger.io/terms/
  contact:
    email: lilia.tabka@police.etat.lu
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.13
paths:
  /v1/messages:
    get:
      tags:
      - messages
      summary: Search messages and return summary information
      description: Search messages  
      operationId: searchMessages
      parameters:
      - name: parentId
        in: query
        description: Identifier of the parent message.
        required: false
        schema:
          type: integer
          format: int64
      - name: channel
        in: query
        description: Identifier of the channel.
        required: false
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MessageLight"
        "400":
          description: Invalid Request
        "404":
          description: Not Found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags:
      - messages
      summary: Create a message
      description: Create a new message
      operationId: CreateMessage
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessage"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid Request
        "404":
          description: Not Found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/messages/{id}:
    get:
      tags:
      - messages
      summary: Retrieve a message
      description: Retrieve a message based on his id  
      operationId: getMessage
      parameters:
      - name: id
        in: path
        description: Identifier of the message to return.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid Request
        "404":
          description: Not Found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - messages
      summary: Update a message
      description: Update the message
      operationId: UpdateMessage
      parameters:
      - name: id
        in: path
        description: Identifier of the message to return.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Message"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid Request
        "404":
          description: Not Found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags:
      - messages
      summary: Modify some fields in a message
      description: Modify some fields in a message
      operationId: PatchMessage
      parameters:
      - name: id
        in: path
        description: Identifier of the message to return.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchMessage"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid Request
        "404":
          description: Not Found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /v1/messages/{id}/comments:
    post:
      tags:
      - messages
      summary: Add a comment on a message
      description: Add a comment on a message
      operationId: PostMessageComment
      parameters:
      - name: id
        in: path
        description: Identifier of the message to return.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateMessageComment"
        required: true
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageComment"
        "400":
          description: Invalid Request
        "404":
          description: Not Found
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
