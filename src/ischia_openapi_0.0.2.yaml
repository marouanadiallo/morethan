          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    VehicleLight:
      type: object
      properties:
        licencePlate:
          type: string
        hull:
          type: string
        country:
          type: string
        firstRegistrationDate:
          type: string
          format: date-time
        category:
          type: string
        color:
          type: string
        brand:
          type: string
        model:
          type: string
        remarks:
          type: string
    Vehicle:
      type: object
      properties:
        id:
          type: integer
          format: int64
        licencePlate:
          type: string
        hull:
