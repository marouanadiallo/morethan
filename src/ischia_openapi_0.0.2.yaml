        physicalPersons:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        legalDocuments:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocument'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
    HandlingCode:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
    Recipient:
      type: object
      properties:
        id:
          type: integer
          format: int64
        isCopyCarbon:
          type: boolean
        email:
          type: string
    Attachment:
      type: object
      properties:
        id:
          type: integer
