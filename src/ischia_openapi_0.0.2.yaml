components:
  schemas:
    CreateMessage:
      type: object
      properties:
        messageOrigin:
          type: string
          example: "IRMA"
        parentId:
          type: integer
          format: int64
        channel:
          type: integer
          format: int64
        messagePriority:
          type: integer
          format: int64
        messageReliability:
          type: integer
          format: int64
        messageType:
          type: integer
          format: int64
        messageStatus:
          type: integer
          format: int64
        messageSubject:
          type: string
        messageBody:
          type: string
        recipients:
          type: array
          format: int64
        copyCarbon:
          type: array
          format: int64
        physicalPersons:
          type: array
          items:
            $ref: '#/components/schemas/PersonLight'          
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleLight'
        legalDocuments:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocumentLight'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/ExternalReference'
    CreateMessageComment:
      type: object
      properties:
        content:
          type: string
          example: "My comment"
    MessageLight:
      type: object
      properties:
        id:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
        caseCategory:
          type: string
        messageNumber:
          type: string
        messageDirection:
          type: string
        sender:
          type: string
        channel:
          type: integer
          format: int64
        messagePriority:
          type: integer
          format: int64
        messageReliability:
          type: integer
          format: int64
        messageType:
          type: integer
          format: int64
        messageStatus:
          type: integer
          format: int64
        messageSubject:
          type: string
        messageBody:
          type: string
        receptionDate:
          type: string
          format: date-time
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        sienaCase:
          type: object
          $ref: '#/components/schemas/SienaCase'
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/ExternalReference'
    Message:
      type: object
      properties:
        messageId:
          type: integer
          format: int64
        parentMessageId:
          type: integer
          format: int64
        caseCategory:
          type: string
        messageNumber:
          type: string
        messageDirection:
          type: string
        sender:
          type: string
        channel:
          type: integer
          format: int64
        messagePriority:
          type: integer
          format: int64
        messageReliability:
          type: integer
          format: int64
        messageType:
          type: integer
          format: int64
        messageStatus:
          type: integer
          format: int64
        messageSubject:
          type: string
        messageBody:
          type: string
        receptionDate:
          type: string
          format: date-time
        otherCrimesArea:
          type: string
        handlingCodes:
          type: array
          items:
            $ref: '#/components/schemas/HandlingCode'
        h3HandlingCodeJustification:
          type: string
        recipients:
          type: array
          items:
            $ref: '#/components/schemas/Recipient'
        physicalPersons:
          type: array
          items:
            $ref: '#/components/schemas/Person'
        legalDocuments:
          type: array
          items:
            $ref: '#/components/schemas/LegalDocument'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/Vehicle'
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        sienaCase:
          type: object
          $ref: '#/components/schemas/SienaCase'
        externalReferences:
          type: array
          items:
            $ref: '#/components/schemas/ExternalReference'
    MessageComment:
      type: object
      properties:
        id:
          type: integer
          format: int64
          example: "123"
        author:
          type: string
          example: "xttc6907"
        creationDate:
          type: string
          format: date-time
          example: "2024-01-01T00:00:00Z"
        content:
          type: string
          example: "My comment"
    PatchMessage:
      type: object
      properties:
        messagePriority:
          type: integer
          format: int64
        messageReliability:
          type: integer
          format: int64
        messageType:
          type: integer
          format: int64
        messageStatus:
          type: integer
          format: int64
        messageSubject:
          type: string
        messageBody:
          type: string
        recipients:
          type: array
          items:
