          type: string
        sourceApplication:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedBy:
          type: string
    BaseReferentialDto:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        labelDe:
          type: string
        labelFr:
          type: string
        labelEn:
          type: string
        validityFrom:
          type: string
          format: date
        validityTo:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        createdBy:
          type: string
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          type: string
    ErrorResponse:
      type: object
      description: Generic error response
      properties:
        timestamp:
          type: string
          format: date-time
          description: Time the error was produced
          example: "2024-01-01T00:00:00Z"
        status:
          type: integer
          format: int32
          description: HTTP status code
        code:
          type: string
          description: Stable error code)
          example: MESSAGE_NOT_FOUND
        error:
          type: string
          description: Localized message (absent for validation errors)
        message:
          type: string
  securitySchemes:
    bearer: 
      type: "http"
      name: "bearer authentication"
      in: "header"
      scheme: "bearer"
      bearerFormat: "JWT"
