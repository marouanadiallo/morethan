openapi: "3.0.3"
info:
  title: ISCHIA Back API
  version: "0.0.2"
  description: |-
    API contract between the ISCHIA front application and the ISCHIA back.
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: https://api.server.test
security:
  - bearerAuth: []
tags:
  - name: Messages
    description: Dashboard, message details, drafts and attachments.

paths:
  /api/v1/messages:
    get:
      tags: [Messages]
      operationId: searchDashboardMessages
      summary: Returns a paginated list of dashboard messages.
      parameters:
        - in: query
          name: messageNumber
          schema:
            type: string
          description: Filter by SIENA message number.
        - in: query
          name: typeId
          schema:
            type: array
            items: { type: integer, format: int64 }
          description: Filter by message type ids.
        - in: query
          name: priorityId
          schema:
            type: array
            items: { type: integer, format: int64 }
          description: Filter by priority ids.
        - in: query
          name: statusId
          schema:
            type: array
            items: { type: integer, format: int64 }
          description: Filter by status ids.
        - in: query
          name: stateId
          schema:
            type: array
            items: { type: integer, format: int64 }
          description: Filter by state ids.
        - in: query
          name: sender
          schema:
            type: array
            items: { type: string }
          description: Filter by sender.
        - in: query
          name: recipient
          schema:
            type: array
            items: { type: string }
          description: Filter by recipient.
        - in: query
          name: subject
          schema:
            type: string
          description: Filter by subject (contains, case-insensitive).
        - in: query
          name: hasAttachments
          schema:
            type: boolean
          description: Filter by presence of attachments.
        - in: query
          name: categoryId
          schema:
            type: integer
            format: int64
          description: Filter by case category id.
        - in: query
          name: direction
          schema:
            $ref: "#/components/schemas/MessageDirection"
          description: Filter by direction.
        - in: query
          name: channelId
          schema:
            type: integer
            format: int64
          description: Filter by channel id.
        - in: query
          name: driReference
          schema:
            type: string
          description: Filter by DRI reference.
        - in: query
          name: timeRemaining
          schema:
            type: boolean
          description: Filter messages that still have processing time remaining.
        - in: query
          name: receivedFrom
          schema:
            type: string
            format: date-time
          description: Start of the received date range (inclusive).
        - in: query
          name: receivedTo
          schema:
            type: string
            format: date-time
          description: End of the received date range (inclusive). Must be after receivedFrom.
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Size"
        - $ref: "#/components/parameters/Sort"
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardMessagePage"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/messages/draft:
    post:
      tags: [Messages]
      operationId: createDraftMessage
      summary: Creates a new empty draft message.
      responses:
        "201":
          description: Draft message created successfully.
          headers:
            Location:
              description: URI of the created draft.
              schema:
                type: string
                format: uri
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DraftCreated"
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/messages/{id}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    get:
      tags: [Messages]
      operationId: getMessageDetails
      summary: Returns the details of a message.
      responses:
        "200":
          description: Successful operation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageDetails"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
    put:
      tags: [Messages]
      operationId: updateMessage
      summary: Updates an existing message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "204":
          description: Message updated successfully.
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

  /api/v1/messages/{id}/attachments:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [Messages]
      operationId: uploadMessageAttachments
      summary: Uploads one or more attachments to a message.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "201":
          description: Attachments uploaded successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Attachment"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "413":
          description: Payload too large.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
        "500": { $ref: "#/components/responses/InternalServerError" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    MessageId:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
      description: The message id.
    Page:
      in: query
      name: page
      schema:
        type: integer
        minimum: 0
        default: 0
      description: Zero-based page index.
    Size:
      in: query
      name: size
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      description: Number of items per page.
    Sort:
      in: query
      name: sort
      schema:
        type: array
        items:
          type: string
        default: ["receivedAt,desc"]
      description: "Sort criteria, format `property,(asc|desc)`. Example: `receivedAt,desc`."

  responses:
    BadRequest:
      description: Invalid request parameters.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Unauthorized:
      description: Missing or invalid authentication token.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    Forbidden:
      description: Authenticated user is not allowed to access this resource.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    NotFound:
      description: Resource not found.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    InternalServerError:
      description: Internal server error.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }
    ServiceUnavailable:
      description: A downstream service is unavailable.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/ProblemDetail" }

  schemas:
    # ---------- Enums ----------
    MessageDirection:
      type: string
      enum: [INBOUND, OUTBOUND]
      description: Direction of the message.

    # ---------- Shared references ----------
    PartyRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    Recipient:
      allOf:
        - $ref: "#/components/schemas/PartyRef"
        - type: object
          required: [isCarbonCopy]
          properties:
            isCarbonCopy:
              type: boolean
              description: True if the recipient is in carbon copy (CC).
    UnitRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
    UserRef:
      type: object
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        unitId:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
    SienaCaseRef:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
        messageNumber:
          type: string
          description: SIENA message number.
        categoryId:
          type: integer
          format: int64
    Attachment:
      type: object
      required: [id, uuid, name, contentType, size]
      properties:
        id:
          type: integer
          format: int64
        uuid:
          type: string
          format: uuid
        name:
          type: string
        contentType:
          type: string
          description: MIME type of the attachment.
        size:
          type: integer
          format: int64
          description: Size in bytes.
        url:
          type: string
          format: uri
          description: URL to download the attachment.
    Comment:
      type: object
      required: [author, content, createdAt]
      properties:
        author:
          $ref: "#/components/schemas/PartyRef"
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    Assignees:
      type: object
      properties:
        units:
          type: array
          items: { $ref: "#/components/schemas/UnitRef" }
        users:
          type: array
          items: { $ref: "#/components/schemas/UserRef" }

    # ---------- Dashboard ----------
    DashboardMessage:
      type: object
      description: One row of the dashboard data table.
      required: [id, direction, subject, hasAttachments, statusId, receivedAt]
      properties:
        id:
          type: integer
          format: int64
        direction:
          $ref: "#/components/schemas/MessageDirection"
        subject:
          type: string
        hasAttachments:
          type: boolean
        channelId:
          type: integer
          format: int64
        driReference:
          type: string
        sender:
          type: string
          description: Display name of the sender.
        recipients:
          type: array
          items:
            type: string
          description: Display names of the recipients.
        typeId:
          type: integer
          format: int64
        statusId:
          type: integer
          format: int64
        stateId:
          type: integer
          format: int64
        priorityId:
          type: integer
          format: int64
        sienaCase:
          $ref: "#/components/schemas/SienaCaseRef"
        timeRemaining:
          type: boolean
          description: True if there is still processing time remaining.
        receivedAt:
          type: string
          format: date-time
    PageMetadata:
      type: object
      required: [number, size, totalElements, totalPages]
      properties:
        number:
          type: integer
          description: Current page index (zero-based).
        size:
          type: integer
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
    DashboardMessagePage:
      type: object
      required: [content, page]
      properties:
        content:
          type: array
          items: { $ref: "#/components/schemas/DashboardMessage" }
        page:
          $ref: "#/components/schemas/PageMetadata"

    # ---------- Details ----------
    MessageDetails:
      type: object
      required: [id, direction, subject, sender, recipients, receivedAt]
      properties:
        id:
          type: integer
          format: int64
        parentReferenceId:
          type: integer
          format: int64
          description: Id of the parent message, if any.
        direction:
          $ref: "#/components/schemas/MessageDirection"
        driReference:
          type: string
        subject:
          type: string
        sender:
          $ref: "#/components/schemas/PartyRef"
        recipients:
          type: array
          items: { $ref: "#/components/schemas/Recipient" }
        body:
          type: string
        sienaCase:
          $ref: "#/components/schemas/SienaCaseRef"
        typeId:
          type: integer
          format: int64
        statusId:
          type: integer
          format: int64
        stateId:
          type: integer
          format: int64
        channelId:
          type: integer
          format: int64
        confidentialityId:
          type: integer
          format: int64
        priorityId:
          type: integer
          format: int64
        reliabilityId:
          type: integer
          format: int64
        handlingCodeIds:
          type: array
          items: { type: integer, format: int64 }
        crimeAreaId:
          type: integer
          format: int64
        assignedTo:
          $ref: "#/components/schemas/Assignees"
        attachments:
          type: array
          items: { $ref: "#/components/schemas/Attachment" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/Comment" }
        receivedAt:
          type: string
          format: date-time
        remainingAt:
          type: string
          format: date-time
          description: Deadline for processing the message.

    # ---------- Requests ----------
    DraftCreated:
      type: object
      required: [id]
      properties:
        id:
          type: integer
          format: int64
    MessageRequest:
      type: object
      required: [subject, body, confidentialityId, reliabilityId, channelId, recipientIds]
      properties:
        subject:
          type: string
          maxLength: 255
        body:
          type: string
        channelId:
          type: integer
          format: int64
        recipientIds:
          type: array
          minItems: 1
          items: { type: integer, format: int64 }
        carbonCopyIds:
          type: array
          items: { type: integer, format: int64 }
        handlingCodeIds:
          type: array
          items: { type: integer, format: int64 }
        crimeAreaId:
          type: integer
          format: int64
        confidentialityId:
          type: integer
          format: int64
        reliabilityId:
          type: integer
          format: int64
        assigneeIds:
          type: object
          properties:
            units:
              type: array
              items: { type: integer, format: int64 }
            users:
              type: array
              items: 
                type: object
                properties: 
                  id: 
                    type: integer
                    format: int64
                  role:
                    type: integer
                    format: int64
        attachmentIds:
          type: array
          items: { type: integer, format: int64 }

    # ---------- Errors ----------
    ProblemDetail:
      type: object
      description: RFC 9457 problem details. Extra properties are serialized at the root level.
      additionalProperties: true
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
